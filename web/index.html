<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品关系审核台</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#1f2937;background:#f3f5f8}body{max-width:1440px;margin:auto;padding:28px}h1{margin:0 0 8px}h2{font-size:18px}small,.muted{color:#64748b}button,select,input,textarea{font:inherit;border:1px solid #ccd5df;border-radius:7px;padding:8px;background:white}button{cursor:pointer;color:#175c55}button:hover{background:#e1f4ef}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.panel,.card{background:white;border:1px solid #dfe5ec;border-radius:12px;padding:18px;margin:14px 0}.banner{background:#fff2cf;padding:12px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.product{display:flex;gap:16px}.product img{width:140px;height:170px;object-fit:contain;background:#f5f5f5;border-radius:8px}.attrs{font-size:13px;line-height:1.7}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#e7f4f0;color:#1a6658;margin-right:5px}.bars{display:flex;gap:12px;flex-wrap:wrap}.bar{background:#e8eef6;padding:10px;border-radius:6px}.score{border-top:1px solid #edf0f3;padding:10px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:7px;border-bottom:1px solid #e5e7eb}textarea{width:95%;min-height:45px}.error{color:#b42318}#message{position:sticky;top:0;background:#e7f4f0;padding:8px;z-index:2}a{color:#177c6f}details{margin:8px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}.product img{width:90px;height:120px}body{padding:14px}}
</style>
<h1>商品关系审核台</h1><div class="muted">SPU · 相似 / 功能互补 / 风格搭配 · 本地审核与版本对比</div>
<div id="message" hidden></div>
<div class="toolbar"><select id="run" aria-label="当前运行"></select><button id="refresh">刷新</button><select id="compare" aria-label="对比运行"><option value="">不对比</option></select><button id="export">导出结果与标注</button><button id="pairsExport">导出商品对 CSV</button></div>
<div id="meta" class="banner"></div>
<div class="panel"><h2>流水线统计 · 召回阶段</h2><div id="pipeline" class="bars muted">加载中…</div></div>
<div class="panel"><h2>两阶段流水线 · 初筛 → 精判</h2><div id="stageStats" class="bars muted">加载中…</div>
<div class="toolbar"><label>初筛阈值 <input type="range" id="scrT" min="0" max="1" step="0.05" value="0.5"></label><span id="scrTval" class="muted">0.5</span> <span id="routePreview" class="muted"></span></div></div>
<div class="panel"><h2>候选对浏览</h2>
<div class="toolbar"><input id="pairSearch" placeholder="商品名/SPU 搜索"><button id="prevPair">上一页</button><span id="pairPage" class="muted"></span><button id="nextPair">下一页</button><span id="pairInfo" class="muted"></span></div><div id="pairs"></div></div>
<div class="toolbar"><input id="search" placeholder="商品名或 SPU ID（查看单商品关系）"><select id="branch"><option value="">全部部门</option></select><select id="category"><option value="">全部类目</option></select><select id="relation"><option value="">全部关系</option><option value="similar">相似</option><option value="complement">搭配</option><option value="both">两者兼有</option><option value="none">无明确关系</option><option value="unknown">待判断</option><option value="error">调用失败</option></select><label>成立阈值 <select id="threshold"><option>1</option><option selected>2</option><option>3</option></select></label><select id="reviewFilter"><option value="">全部审核状态</option><option value="unreviewed">未审核</option><option value="agree">同意</option><option value="corrected">已修正</option><option value="uncertain">无法判断</option></select><label><input type="checkbox" id="changed">只看版本变化</label></div>
<div class="panel"><h2>当前筛选分布</h2><div id="stats" class="bars"></div><div id="scores" class="bars"></div><p class="muted">分布仅代表已判定候选样本，不能代表全商品；分数是关系强度，Jev 的概率与置信度另行展示。图片仅供人工审核，当前模型未看图。</p><div id="metrics"></div><details><summary>部门关系矩阵（无序商品对；点击筛选部门）</summary><div id="matrix"></div></details></div>
<div class="toolbar"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><main id="cards"></main>
<script>
const $=id=>document.getElementById(id), dims=['similarity','functional_complement','style_pairing'], names=['相似','功能互补','风格搭配'];
const labels={similar:'相似',complement:'搭配',both:'两者兼有',none:'无明确关系',unknown:'待判断',error:'调用失败'};
let data=null,other=null,page=0;const pageSize=15;
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tell(t){$('message').hidden=false;$('message').textContent=t}
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error('请求失败 '+r.status);return r.json()}
function rel(r){if(r.status!=='ok')return 'error';const v=dims.map(k=>r.result[k].score),t=+$('threshold').value,s=v[0]!==null&&v[0]>=t,c=v.slice(1).some(x=>x!==null&&x>=t);return s&&c?'both':s?'similar':c?'complement':v.includes(null)?'unknown':'none'}
function differs(r){const o=other?.records.find(x=>x.pair_id===r.pair_id);return o&&JSON.stringify(dims.map(k=>r.result?.[k].score))!==JSON.stringify(dims.map(k=>o.result?.[k].score))}
async function init(){const runs=await api('/api/runs');const selected=$('run').value;$('run').innerHTML=runs.map(r=>`<option value="${esc(r.run_id)}">${esc(r.run_id)} · ${esc(r.provider)} · ${esc(r.model)}</option>`).join('');$('compare').innerHTML='<option value="">不对比</option>'+$('run').innerHTML;if(runs.some(r=>r.run_id===selected))$('run').value=selected;if(runs.length)await load();else $('meta').textContent='暂无运行。请先执行 uv run python -m relations run --provider demo';}
async function load(){data=await api('/api/run/'+$('run').value);other=$('compare').value?await api('/api/run/'+$('compare').value):null;page=0;const ps=Object.values(data.products);for(const [id,key] of [['branch','branch'],['category','category']]){const prev=$(id).value;$(id).innerHTML=`<option value="">全部${id==='branch'?'部门':'类目'}</option>`+[...new Set(ps.map(p=>p[key]).filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join('');if([...$(id).options].some(o=>o.value===prev))$(id).value=prev;}$('meta').textContent=`${data.manifest.provider==='demo'?'演示数据：规则占位输出，不代表模型效果。 ':''}${data.manifest.status} · ${data.records.length}/${data.manifest.pair_count} 对 · ${data.manifest.prompt_version} · 商品总体 ${data.manifest.population} SPU`;render();}
function filtered(){const q=$('search').value.toLowerCase();return data.records.filter(r=>{const ps=[data.products[r.a],data.products[r.b]],rv=data.reviews[r.pair_id];return (!q||ps.some(p=>(p.name+' '+p.spu_id).toLowerCase().includes(q)))&&(!$('branch').value||ps.some(p=>p.branch===$('branch').value))&&(!$('category').value||ps.some(p=>p.category===$('category').value))&&(!$('relation').value||rel(r)===$('relation').value)&&(!$('reviewFilter').value||($('reviewFilter').value==='unreviewed'?!rv:rv?.status===$('reviewFilter').value))&&(!$('changed').checked||differs(r));})}
function product(p){let url='';try{const u=new URL(p.image_url);if(['https:','http:'].includes(u.protocol))url=u.href}catch{}return `<div class="product">${url?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(url)}" alt="商品图片" onerror="this.alt='图片无法加载';this.removeAttribute('src')">`:'<span>无图片</span>'}<div><b>${esc(p.name)}</b><div><button data-spu="${esc(p.spu_id)}">${esc(p.spu_id)}</button> · ¥${esc(p.price)}</div><div class="attrs">${esc([p.branch,p.category_group,p.category,p.subcategory].filter(Boolean).join(' / '))}<br>风格：${esc(p.style)} · 季节：${esc(p.season)}<br>属性：${esc(p.attribute_text)}<br>可选颜色：${esc(p.available_colors.join(' / '))}<br>主题：${esc(p.theme)}</div><details><summary>完整商品输入</summary><pre>${esc(JSON.stringify(p,null,2))}</pre></details></div></div>`}
function render(){if(!data)return;const rows=filtered(),counts={};rows.forEach(r=>counts[rel(r)]=(counts[rel(r)]||0)+1);$('stats').innerHTML=`<div class="bar">筛选 ${rows.length} 对</div>`+Object.entries(counts).map(([k,n])=>`<div class="bar">${labels[k]} <b>${n}</b> · ${rows.length?(100*n/rows.length).toFixed(1):0}%</div>`).join('');$('scores').innerHTML=dims.map((k,i)=>{const c={};rows.filter(r=>r.status==='ok').forEach(r=>{const s=r.result[k].score??'未知';c[s]=(c[s]||0)+1});return `<div class="bar">${names[i]}：${Object.entries(c).map(([s,n])=>`${s}分=${n}`).join(' · ')}</div>`}).join('');
const matrix={};for(const r of rows){const k=[data.products[r.a].branch,data.products[r.b].branch].sort().join(' ↔ ');matrix[k]??={n:0,yes:0};matrix[k].n++;if(['similar','complement','both'].includes(rel(r)))matrix[k].yes++}$('matrix').innerHTML='<table><tr><th>部门对</th><th>全部样本（含失败）</th><th>成立关系</th><th>比例</th></tr>'+Object.entries(matrix).map(([k,v])=>`<tr><td><button data-branch="${esc(k.split(' ↔ ')[0])}">${esc(k)}</button></td><td>${v.n}</td><td>${v.yes}</td><td>${(100*v.yes/v.n).toFixed(1)}%</td></tr>`).join('')+'</table>';
const reviewed=rows.filter(r=>data.reviews[r.pair_id]);$('metrics').textContent=`已审核 ${reviewed.length} 对；`+dims.map((k,i)=>{const usable=reviewed.filter(r=>r.status==='ok'&&data.reviews[r.pair_id].status!=='uncertain'&&data.reviews[r.pair_id].scores[k]!==null);const hits=usable.filter(r=>r.result[k].score===data.reviews[r.pair_id].scores[k]).length;return `${names[i]}人工评分一致 ${hits}/${usable.length}`}).join(' · ')+'（审核样本非随机时，不代表总体准确率）';
page=Math.min(page,Math.max(0,Math.ceil(rows.length/pageSize)-1));$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(rows.length/pageSize))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*pageSize>=rows.length;
$('cards').innerHTML=rows.slice(page*pageSize,(page+1)*pageSize).map(r=>{const rv=data.reviews[r.pair_id],o=other?.records.find(x=>x.pair_id===r.pair_id);return `<article class="card" data-pair="${r.pair_id}"><div><span class="pill">${labels[rel(r)]}</span><small>${esc(r.source)} · ${r.latency_ms} ms · ${rv?'已审核':'未审核'}</small></div><div class="grid">${product(data.products[r.a])}${product(data.products[r.b])}</div>${r.status==='error'?`<p class="error">${esc(r.error)}</p>`:dims.map((k,i)=>{const d=r.result[k];return `<div class="score"><b>${names[i]}：${d.score??'待判断'}</b> ${esc(d.reason??'该后端不生成解释；请检查原始输入和判断分布。')}${d.probabilities?`<div class="muted">概率 ${esc(JSON.stringify(d.probabilities))} · 置信度 ${esc(d.confidence)}</div>`:''}<details><summary>证据 / 条件 / 冲突 / 信息不足</summary><pre>${esc(JSON.stringify(d,null,2))}</pre></details></div>`}).join('')}${o?`<p>对比运行评分：${esc(dims.map((k,i)=>names[i]+': '+(o.result?.[k].score??'未知/失败')).join(' / '))} ${differs(r)?'⚑ 有变化':''}${other.manifest.data_hash!==data.manifest.data_hash?'（注意：数据快照不同）':''}</p>`:''}<details><summary>原始响应与运行记录</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details><div class="toolbar"><select data-status aria-label="审核结论">${[['agree','同意'],['corrected','修正'],['uncertain','无法判断']].map(([v,n])=>`<option value="${v}" ${rv?.status===v?'selected':''}>${n}</option>`).join('')}</select>${dims.map((k,i)=>`<label>${names[i]} <select data-score="${k}">${['unknown',0,1,2,3].map(v=>{const s=rv?rv.scores[k]:r.result?.[k].score;return `<option value="${v}" ${(s??'unknown')===v?'selected':''}>${v==='unknown'?'未知':v}</option>`}).join('')}</select></label>`).join('')}<button data-save>保存审核</button></div><textarea data-note placeholder="错误原因、修改依据">${esc(rv?.note??'')}</textarea></article>`}).join('')||'<div class="panel">当前筛选无结果</div>';
}
document.addEventListener('click',async e=>{try{if(e.target.dataset.spu){$('search').value=e.target.dataset.spu;page=0;render()}if(e.target.dataset.branch){$('branch').value=e.target.dataset.branch;page=0;render()}if(e.target.hasAttribute('data-save')){const card=e.target.closest('[data-pair]'),scores={};card.querySelectorAll('[data-score]').forEach(s=>scores[s.dataset.score]=s.value==='unknown'?null:+s.value);const review={status:card.querySelector('[data-status]').value,scores,note:card.querySelector('[data-note]').value};await api('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:data.manifest.run_id,pair_id:card.dataset.pair,review})});data.reviews[card.dataset.pair]=review;tell('审核已保存到本地 runs 目录');render()}}catch(err){tell(err.message)}});
for(const id of ['branch','category','relation','threshold','reviewFilter','changed'])$(id).onchange=()=>{page=0;render()};$('search').oninput=()=>{page=0;render()};$('run').onchange=()=>load().catch(e=>tell(e.message));$('compare').onchange=()=>load().catch(e=>tell(e.message));$('refresh').onclick=()=>init().catch(e=>tell(e.message));$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>{if(data)download(data.manifest.run_id+'.json',JSON.stringify({...data,records:filtered()},null,2),'application/json')};$('pairsExport').onclick=()=>{if(data)download('pairs.csv','a,b\n'+filtered().map(r=>r.a+','+r.b).join('\n'),'text/csv')};init().catch(e=>tell(e.message));
async function loadPipeline(){try{const s=await api('/api/stats'),r=s.recall||{},cov=r.coverage||{},idx=s.index_state||{};const bar=(k,v)=>`<div class="bar">${k} <b>${v}</b></div>`;const a=cov.anchors??0;$('pipeline').innerHTML=bar('商品','总计 '+s.products_total+' · 活跃 '+s.products_active)+bar('商品向量','缓存 '+s.embedded+'（模型 '+esc(idx.model??'—')+' · 维 '+esc(idx.dim??'—')+' · 索引数 '+esc(idx.count??'—')+'）')+bar('召回','唯一商品对 '+s.pairs+' · 通道来源边 '+s.edges)+bar('每通道配对',esc(JSON.stringify(s.per_channel||{})))+bar('功能互补覆盖',(cov.functional??0)+'/'+a+' · 未覆盖 '+Math.max(0,a-(cov.functional??0)))+bar('风格搭配覆盖',(cov.style??0)+'/'+a+' · 未覆盖 '+Math.max(0,a-(cov.style??0)));}catch(e){$('pipeline').textContent='暂无流水线数据：请先运行 index / retrieve（'+e.message+'）';}}loadPipeline();
const STAGE_LABELS={pending:'待初筛',screened:'初筛过滤',insufficient:'信息不足',passed:'待精判',ok:'已精判',error:'失败'};let stageData=null,pairPg=0,psrch='';
function stageOf(r){const sc=r.screen,dt=r.detail,thr=stageData?stageData.config.threshold:0.5;if(!sc)return'pending';if(sc.status==='insufficient_input')return'insufficient';if(sc.status==='error')return'error';if(!dt)return sc.probability_related>=thr?'passed':'screened';return dt.status==='ok'?'ok':'error';}
async function loadStage(){try{stageData=await api('/api/pipeline');const s=stageData.stats,sc=s.screen,dt=s.details,tk=s.tokens,rc=s.run_counts||{},rp=stageData.route_preview;const bar=(k,v)=>`<div class="bar">${k} <b>${v}</b></div>`;const hist=(s.prob_histogram||[]).map((n,i)=>`${(i/10).toFixed(1)}~${((i+1)/10).toFixed(1)}=${n}`).join(' · ');$('stageStats').innerHTML=bar('候选对',s.pairs_total)+bar('初筛','完成 '+sc.total+' / 待 '+sc.pending+' · 通过率 '+(s.screen_pass_rate? (100*s.screen_pass_rate).toFixed(1):'0')+'%')+bar('初筛细分','ok '+sc.ok+' / 信息不足 '+sc.insufficient_input+' / 失败 '+sc.error)+bar('精判','ok '+dt.ok+' / 失败 '+dt.error+' · 路由 '+JSON.stringify(dt.routes||{}))+bar('概率分布',hist)+bar('调用/复用','初筛 '+(rc.screen_called||0)+'/'+(rc.screen_reused||0)+' · 精判 '+(rc.detail_called||0)+'/'+(rc.detail_reused||0))+bar('token',JSON.stringify(tk));$('scrT').value=stageData.config.threshold;$('scrTval').textContent=stageData.config.threshold;$('routePreview').textContent='当前阈值路由 '+JSON.stringify(rp);}catch(e){$('stageStats').textContent='暂无两阶段数据：请先运行 pipeline（'+e.message+'）';}}
function scoreHtml(res){return res&&dims.map((k,i)=>`<span class="pill">${names[i]} ${(res[k]?.score??'未知')}</span>`).join('')||'';}
function reviewHtml(r){const rv=r.review||{},cur=rv.scores||{};const op=k=>['unknown',0,1,2,3].map(v=>`<option value="${v}" ${((cur[k]??'unknown')===v?'selected':'')}>${v==='unknown'?'未知':v}</option>`).join('');return `<select data-status>${[['agree','同意'],['corrected','修正'],['uncertain','无法判断']].map(([v,n])=>`<option value="${v}" ${rv.status===v?'selected':''}>${n}</option>`).join('')}</select> `+dims.map(k=>`<label>${names[k]}<select data-score="${k}">${op(k)}</select></label>`).join('')+`<button data-savepair>保存</button><textarea data-note placeholder="备注">${esc(rv.note??'')}</textarea>`;}
async function loadPairs(){if(!stageData)return;try{const off=pairPg*50;const d=await api('/api/pairs?limit=50&offset='+off+(psrch?'&q='+encodeURIComponent(psrch):''));$('pairInfo').textContent='共 '+d.total+' 对';$('pairPage').textContent=(pairPg+1)+' / '+Math.max(1,Math.ceil(d.total/50));$('prevPair').disabled=pairPg===0;$('nextPair').disabled=(pairPg+1)*50>=d.total;const sc=stageData.config.threshold;$('pairs').innerHTML=d.rows.map(r=>{const st=stageOf(r),sc2=r.screen,dt=r.detail;let body='';if(sc2)body+=`<div>初筛概率 <b>${sc2.probability_related??'—'}</b>（阈值 ${sc}）</div>`;if(st==='screened')body+='<div class="muted">初筛过滤 ≠ 精判无关系</div>';else if(st==='passed')body+='<div class="muted">待精判</div>';else if(st==='insufficient')body+='<div class="muted">信息不足，未伪造概率</div>';else if(st==='error')body+='<div class="error">调用失败 ≠ 无关系</div>';else if(dt&&dt.status==='ok')body+='<div>'+scoreHtml(dt.result)+(dt.label?' <span class="pill">'+esc(dt.label)+'</span>':'')+'</div>';const chans=(r.channels||[]).map(c=>c.channel+'#'+c.rank).join(',');return `<article class="card" data-pk="${esc(r.pair_key)}"><div><span class="pill">${STAGE_LABELS[st]}</span><small class="muted">${esc(chans)}</small></div><div class="grid"><div><b>${esc(r.a_name||r.a)}</b><div class="muted">${esc(r.a_branch||'')} / ${esc(r.a_cat||'')}</div></div><div><b>${esc(r.b_name||r.b)}</b><div class="muted">${esc(r.b_branch||'')} / ${esc(r.b_cat||'')}</div></div></div>${body}<details><summary>审核</summary>${reviewHtml(r)}</details></article>`;}).join('')||'<div class="panel">无匹配</div>';}catch(e){$('pairs').textContent='错误 '+e.message;}}
document.addEventListener('click',async e=>{if(e.target.dataset.savepair){const card=e.target.closest('[data-pk]'),scores={};card.querySelectorAll('[data-score]').forEach(x=>scores[x.dataset.score]=x.value==='unknown'?null:+x.value);await api('/api/pipeline/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pair_key:card.dataset.pk,review:{status:card.querySelector('[data-status]').value,scores,note:card.querySelector('[data-note]').value}})});tell('已保存');loadPairs();}});
$('scrT').oninput=async()=>{$('scrTval').textContent=$('scrT').value;try{const d=await api('/api/preview?threshold='+$('scrT').value);$('routePreview').textContent='阈值 '+d.threshold+' 路由 '+JSON.stringify(d.route)+'（复用概率，未调模型）';}catch(e){}};
$('prevPair').onclick=()=>{if(pairPg>0){pairPg--;loadPairs();}};$('nextPair').onclick=()=>{pairPg++;loadPairs();};$('pairSearch').oninput=()=>{psrch=$('pairSearch').value.trim();pairPg=0;loadPairs();};loadStage().then(loadPairs);
</script></html>
